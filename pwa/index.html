<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life OS</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F5;--surf:#fff;--surf2:#E3E9EE;--tx:#16222C;--mu:#6A7B88;--ac:#0F9D8A;--ac2:#6D5BD0;--warn:#D9822B;--bd:#D7DFE6;--sh:0 8px 24px rgba(30,50,70,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E151C;--surf:#17212B;--surf2:#202C38;--tx:#E8EFF4;--mu:#8A9BA8;--ac:#4FD1BC;--ac2:#A394FF;--warn:#F0A04B;--bd:#273543;--sh:0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0E151C;--surf:#17212B;--surf2:#202C38;--tx:#E8EFF4;--mu:#8A9BA8;--ac:#4FD1BC;--ac2:#A394FF;--warn:#F0A04B;--bd:#273543;--sh:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg)}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 8px}
header h1{font-size:22px;font-weight:700}
header p{font-size:13px;color:var(--mu)}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--surf);color:var(--tx);font-size:18px;cursor:pointer}
main{flex:1;overflow-y:auto;padding:8px 20px 24px}
section{display:none}section.on{display:block}
nav{display:flex;background:var(--surf);border-top:1px solid var(--bd);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:12px;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px}
nav button span{font-size:20px}
nav button.on{color:var(--ac);font-weight:600}
nav button:focus-visible,.ib:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h2{font-size:16px;font-weight:600;margin:20px 0 10px}
.total{background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;border-radius:24px;padding:22px;box-shadow:var(--sh)}
.total small{opacity:.85;font-size:13px}
.total b{display:block;font-size:34px;font-weight:700;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pk{background:var(--surf);border-radius:20px;padding:14px;box-shadow:var(--sh);border:1px solid var(--bd);position:relative;overflow:hidden}
.pk::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--c)}
.pk .t{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.pk .a{font-size:19px;font-weight:700;margin:10px 0 8px}
.pk .a small{font-size:11px;color:var(--mu);font-weight:400}
.bar{height:6px;background:var(--surf2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--ac));border-radius:9px;transition:width .5s}
.row{display:flex;gap:8px;margin-top:12px}
.row button{flex:1;border:0;border-radius:12px;padding:8px 0;font:inherit;font-weight:600;font-size:18px;cursor:pointer;background:var(--surf2);color:var(--tx)}
.row button.p{background:var(--c);color:#fff}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:20px;padding:16px;box-shadow:var(--sh)}
.ringwrap{display:flex;align-items:center;gap:18px}
.ring{width:110px;height:110px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px}
.ringwrap p{color:var(--mu);font-size:13px;line-height:1.7}
.ringwrap p strong{color:var(--tx);font-size:15px}
.gl{margin-bottom:14px}.gl:last-child{margin-bottom:0}
.gl div{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.hb{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
.hb:last-child{border:0}
.hb .n{font-weight:600;font-size:14px}
.dots{display:flex;gap:4px;margin-top:6px}
.dots i{width:12px;height:12px;border-radius:4px;background:var(--surf2)}
.dots i.f{background:var(--ac)}
.st{font-size:13px;color:var(--warn);font-weight:600;margin-inline-end:10px}
.ck{border:1.5px solid var(--ac);background:none;color:var(--ac);border-radius:10px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
.ck.d{background:var(--ac);color:#fff}
.add{display:flex;gap:8px;flex-wrap:wrap}
select{flex:1;font:inherit;color:var(--tx);background:var(--surf2);border:1px solid var(--bd);border-radius:12px;padding:10px}
input[type=number],input[type=date]{flex:1}
.seg{display:flex;background:var(--surf2);border-radius:14px;padding:4px;margin:8px 0 14px}
.seg button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:13px;padding:8px 0;border-radius:10px;cursor:pointer}
.seg .on{background:var(--surf);color:var(--tx);font-weight:600;box-shadow:var(--sh)}
.cc{position:absolute;width:150px;min-height:56px;padding:10px;background:var(--surf2);border:1.5px solid var(--bd);border-radius:14px;font-size:13px;line-height:1.6;white-space:pre-wrap;cursor:grab;user-select:none;-webkit-user-select:none;word-break:break-word}
.cc.sel{border-color:var(--ac);box-shadow:var(--sh)}
input,textarea{font:inherit;color:var(--tx);background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:12px;min-width:0}
input:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}
.add input[type=text]{flex:1 1 100%}
.add input[type=time]{flex:1}
.pb{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
.task{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.task input{width:22px;height:22px;accent-color:var(--ac);padding:0;flex:none}
.task .x{flex:1;font-size:15px}
.task.d .x{text-decoration:line-through;color:var(--mu)}
.task time{font-size:12px;color:var(--ac2);background:var(--surf2);border-radius:8px;padding:3px 8px}
.task button{background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer}
.empty{text-align:center;color:var(--mu);font-size:14px;padding:24px 0}
textarea{width:100%;min-height:90px;resize:vertical;line-height:1.7}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px}
.chip{flex:none;border:1px solid var(--bd);background:var(--surf);color:var(--mu);border-radius:20px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac2);color:#fff;border-color:var(--ac2)}
.note{background:var(--surf);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-top:10px;line-height:1.8;font-size:14px;white-space:pre-wrap}
.note .m{font-size:11px;color:var(--mu);margin-top:8px;display:flex;justify-content:space-between}
a.tg{color:var(--ac2);font-weight:600;cursor:pointer}
a.lk{color:var(--ac);border-bottom:1px dashed var(--ac);cursor:pointer}
a.lk.no{color:var(--warn);border-color:var(--warn)}
.sheet{position:absolute;inset:0;background:rgba(5,10,15,.55);display:none;align-items:flex-end;z-index:5}
.sheet.on{display:flex}
.sheet>div{width:100%;background:var(--surf);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-size:17px;margin-bottom:12px}
.sheet input{width:100%;font-size:22px;text-align:center}
.q{display:flex;gap:8px;margin:12px 0}
.q button{flex:1;border:1px solid var(--bd);background:var(--surf2);color:var(--tx);border-radius:12px;padding:9px 0;font:inherit;cursor:pointer}
.toast{position:absolute;top:70px;inset-inline:20px;background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14px;transform:translateY(-200%);opacity:0;pointer-events:none;transition:transform .3s,opacity .3s;z-index:30}
.toast.on{transform:none;opacity:1}
@media(min-width:900px){
#app{max-width:none;display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto 1fr}
header{grid-column:2;grid-row:1;padding:24px 36px 8px}
header h1{font-size:28px}
main{grid-column:2;grid-row:2;padding:8px 36px 36px;min-width:0}
nav{grid-column:1;grid-row:1/3;flex-direction:column;justify-content:flex-start;gap:6px;border-top:0;border-inline-end:1px solid var(--bd);padding:28px 14px}
nav button{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:12px 16px;justify-content:flex-start}
nav button.on{background:var(--surf2)}
.grid{grid-template-columns:repeat(3,1fr);gap:16px}
.total{padding:28px}.total b{font-size:42px}
.sheet{align-items:center;justify-content:center}
.sheet>div{max-width:440px;border-radius:24px}
.toast{max-width:440px;margin-inline:auto}
#cvw{height:68vh!important}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th{text-align:start;color:var(--mu);font-weight:600;padding:8px 6px;cursor:pointer;border-bottom:1px solid var(--bd);white-space:nowrap}.tb td{padding:10px 6px;border-bottom:1px solid var(--bd)}.tb tr[data-zrow]{cursor:pointer}
.wk{display:grid;grid-template-columns:minmax(70px,1fr) repeat(7,32px);gap:6px;align-items:center}.wk .hd{font-size:11px;text-align:center}.cl{width:32px;height:32px;border-radius:9px;border:1.5px solid var(--bd);background:var(--surf2);cursor:pointer;padding:0;color:#fff;font:inherit;font-weight:700}.cl.f{background:var(--c);border-color:var(--c)}.cl.f::after{content:"✓"}
.cl.sm{width:24px;height:24px;border-radius:7px;font-size:12px}
.hr{display:flex;gap:5px;margin-top:8px}.hr .cl{flex:1;width:auto;height:40px}.hl{display:flex;gap:5px;margin-top:10px}.hl span{flex:1;text-align:center;font-size:10px;font-weight:600}
.g4{margin-top:12px;grid-template-columns:1fr 1fr!important}
.wkc{display:block}.two{display:block}
@media(min-width:900px){.wkc{display:flex;align-items:center;justify-content:center;gap:40px}.wkc .rr{flex:none;margin:0!important}.wkc .bc{margin:0;flex:1;max-width:560px}.two{display:grid;grid-template-columns:1fr 2fr;gap:16px;align-items:start}.add input[type=text]{flex:1 1 320px}}
@media(min-width:900px){.wk{grid-template-columns:minmax(150px,1fr) repeat(7,minmax(44px,1fr));gap:10px 14px}.wk .cl{width:100%;max-width:72px;height:38px;justify-self:center}.wk .hd{font-size:12px}}
.bc{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;position:relative;padding:24px 0 0;padding-inline-start:30px;height:210px;width:100%;max-width:680px;margin:0 auto}
.bgl{position:absolute;top:24px;bottom:24px;inset-inline-start:30px;inset-inline-end:0;pointer-events:none}
.bgl i{position:absolute;inset-inline:0;border-top:1px dashed var(--bd)}.bgl i.tg{border-color:var(--ac2);opacity:.8}
.bgl i b{position:absolute;inset-inline-end:100%;margin-inline-end:8px;transform:translateY(-50%);font-size:10px;font-weight:400;color:var(--mu)}
.bcol{display:flex;flex-direction:column;min-width:0;position:relative;z-index:1}
.bt{flex:1;position:relative}
.bb{position:absolute;bottom:0;left:0;right:0;margin:auto;width:min(100%,38px);height:var(--p);min-height:4px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 40%,transparent));transform-origin:bottom;animation:gr .7s cubic-bezier(.2,.8,.2,1) both;transition:filter .2s}
.bb.z{opacity:.35;min-height:3px}.bt:hover .bb{filter:brightness(1.15)}
.bcol.today .bb{box-shadow:0 0 18px color-mix(in srgb,var(--c) 55%,transparent)}
.bv{position:absolute;left:0;right:0;bottom:calc(var(--p) + 5px);text-align:center;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.bl{height:24px;text-align:center;font-size:11px;color:var(--mu);padding-top:7px}.bcol.today .bl{color:var(--tx);font-weight:700}
@keyframes gr{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.tcw{padding-inline-start:30px}.pl{position:relative;height:var(--th,150px)}.pl .tc{height:100%}
.ya span{position:absolute;inset-inline-end:100%;margin-inline-end:8px;transform:translateY(-50%);font-size:10px;color:var(--mu)}
.dot{position:absolute;right:0;width:10px;height:10px;border-radius:50%;background:var(--ac);transform:translate(50%,-50%);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 28%,transparent),0 0 14px var(--ac)}
.vl,.mk,.tip{display:none;position:absolute}.vl{left:var(--x);top:0;bottom:0;border-left:1px dashed var(--mu)}
.mk{left:var(--x);top:var(--y);width:11px;height:11px;border-radius:50%;background:var(--ac);border:2px solid var(--surf);transform:translate(-50%,-50%)}
.tip{left:var(--x);top:2px;background:var(--tx);color:var(--bg);font-size:12px;font-weight:600;padding:4px 10px;border-radius:9px;white-space:nowrap;pointer-events:none;z-index:2}
.pl.hv .vl,.pl.hv .mk,.pl.hv .tip{display:block}.pl.hv .dot{opacity:.0}
.xl{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);margin-top:6px}
@media(min-width:900px){.bc{height:230px}.pl{--th:200px}}
@media(prefers-reduced-motion:reduce){.bb{animation:none}}
.tc{display:block;width:100%;height:150px}.tc path,.tc line{vector-effect:non-scaling-stroke}.ch{display:block;margin:0 auto;width:100%;max-width:520px}
@media(min-width:900px){.tc{height:200px}}
.hm>div+div{margin-top:12px}.hm>div>.card:first-child,.hm>div>.grid:first-child{margin-top:0!important}
@media(min-width:900px){.hm{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;align-items:start}.hm>div+div{margin-top:0}.c5{grid-column:span 5}.c7{grid-column:span 7}.c12{grid-column:span 12}.hm .total{padding:20px}}
@media(min-width:900px){.g4{grid-template-columns:repeat(4,1fr)!important}}
.seg{overflow-x:auto}.seg button{white-space:nowrap;padding:8px 12px}
.wb{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity}
.dc{flex:none;width:164px;background:var(--surf);border:1px solid var(--bd);border-top:4px solid var(--c);border-radius:16px;padding:10px;scroll-snap-align:center}
.dc.today{box-shadow:0 0 0 2px var(--c),var(--sh)}
.dc .ti{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:10px;font-size:12px;line-height:1.5;margin-top:6px;background:var(--surf2);cursor:pointer;word-break:break-word}
.dc .ti.d{background:color-mix(in srgb,var(--c) 30%,transparent);text-decoration:line-through;color:var(--mu)}
.dc .ti input{width:18px;height:18px;accent-color:var(--c);flex:none;padding:0}
.mr{position:relative;width:46px;height:46px;flex:none}.mr svg{transform:rotate(-90deg)}.mr b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px}
@media(min-width:900px){.wb{display:grid;grid-template-columns:repeat(7,1fr);overflow:visible}.dc{width:auto}}
</style>
</head>
<body>
<div id="app">
<header><div><h1 id="ttl">المالية</h1><p id="sub"></p></div><div style="display:flex;gap:8px"><button class="ib" id="sy" aria-label="المزامنة بين الأجهزة">☁</button><button class="ib" id="nb" aria-label="الإشعارات">🔕</button><button class="ib" id="lk" aria-label="قفل التطبيق">🔒</button><button class="ib" id="th" aria-label="تبديل المظهر">◐</button></div></header>
<main>
<section id="s0"></section>
<section id="s1"></section>
<section id="s2"></section>
<section id="s3"></section>
<section id="s4"></section>
<section id="s5" class="on"></section>
</main>
<nav>
<button class="on" data-i="5"><span>⌂</span>الرئيسية</button>
<button data-i="2"><span>☑</span>المهام</button>
<button data-i="3"><span>✎</span>الأفكار</button>
<button data-i="0"><span>◍</span>المالية</button>
<button data-i="4"><span>☰</span>المزيد</button>
</nav>
<div class="sheet" id="sh"><div>
<h3 id="sht"></h3>
<div id="tr" style="display:none;gap:8px;margin-bottom:12px"><select id="fr"></select><select id="to"></select></div>
<input id="amt" type="number" inputmode="decimal" placeholder="المبلغ">
<div class="q"><button data-q="50">50</button><button data-q="100">100</button><button data-q="500">500</button><button data-q="1000">1000</button></div>
<div class="row"><button id="cx">إلغاء</button><button class="p" id="ok" style="--c:var(--ac)">تأكيد</button></div>
</div></div>
<div class="sheet" id="lc" style="align-items:center;background:var(--bg);z-index:20"><div style="border-radius:24px;margin:20px"><h3 id="lt"></h3><input id="pn" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><div class="row"><button id="lx">إلغاء</button><button class="p" id="lo" style="--c:var(--ac)">تأكيد</button></div><button class="ck" id="lr" style="display:none;margin-top:10px">إزالة القفل</button></div></div>
<div class="toast" id="toast"></div>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const M=n=>S.hide?'••••':N(n);
const N=n=>Number(n).toLocaleString('ar-EG'),P=n=>N(Math.round(n))+'٪';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=k=>{const d=new Date();d.setDate(d.getDate()-k);return d.toLocaleDateString('en-CA')};
const run=(a,b)=>Array.from({length:b-a+1},(_,i)=>iso(a+i));
const streak=h=>{let k=h.d.includes(iso(0))?0:1,c=0;while(h.d.includes(iso(k))){c++;k++}return c};
const S={log:[],rp:'month',sub:0,mood:'🙂',goals:[{t:'إنهاء كورس البرمجة',a:12,g:40,u:'درس'},{t:'ركض ١٠٠ كم',a:35,g:100,u:'كم'}],books:[{t:'العادات الذرية',p:120,n:320}],journal:[{d:iso(0),m:'🙂',x:'يوم هادي، خلّصت أهم مهمة وبدأت كتاب جديد.'}],
 pk:[{n:'مدخرات',i:'🏦',a:12500,g:30000,c:'#0F9D8A',goal:1},{n:'استخدام يومي',i:'☕',a:3200,g:0,c:'#6D5BD0',daily:1},{n:'طوارئ',i:'🛟',a:8000,g:15000,c:'#D9822B',goal:1},{n:'أهداف',i:'🎯',a:4800,g:20000,c:'#D2557A',goal:1}],
 tasks:[{t:'مراجعة ميزانية الأسبوع',tm:'10:00',d:1},{t:'مكالمة مع الفريق',tm:'14:30',d:0},{t:'قراءة ٢٠ صفحة',tm:'21:00',d:0}],
 habits:[{n:'قراءة',d:run(1,6)},{n:'رياضة',d:[...run(1,2),iso(4),iso(6)]},{n:'ادخار يومي',d:run(1,9)}],
 notes:[{id:'n1',ti:'فكرة تطبيق العادات',x:'تطبيق لتتبع العادات مع مكافآت صغيرة #أفكار #مشاريع',t:'٠٩:١٢'},{id:'n2',ti:'ربط الميزانية بالأهداف',x:'انظر [[فكرة تطبيق العادات]] #مالية',t:'٠٩:٤٠'}],isub:0,open:null,edit:false,cv:{cards:[{id:'c1',x:20,y:20,t:'[[فكرة تطبيق العادات]]'},{id:'c2',x:170,y:130,t:'مكافآت صغيرة'},{id:'c3',x:20,y:200,t:'#مشاريع تجريبي'}],edges:[['c1','c2'],['c1','c3']],px:0,py:0,z:1},
 tab:0,sel:null,q:'',tag:null
};
try{const j=localStorage.getItem('lifeos2');if(j)Object.assign(S,JSON.parse(j))}catch(e){}
